<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ghost Hop — One Button Game</title>
  <link rel="stylesheet" href="style.css">
  <script src="libraries/p5.min.js" defer></script>
  <script src="game.js" defer></script>
  <script src="music.js" defer></script>
  <script src="sketch.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div><span class="eyebrow">A LITTLE GAME WHILE YOU WAIT</span><h1>GHOST HOP</h1></div>
      <div class="scores"><span>SCORE <b id="score">00</b></span><span class="coin-counter">COINS <b id="coins">00</b></span><span>BEST <b id="best">00</b></span></div>
    </header>
    <div id="stage" aria-label="Double-jumping pixel ghost avoiding graves, high towers, spikes, and roaming bats"></div>
    <footer>
      <p id="message" role="status">A little game while you wait. Tap twice to jump higher.</p>
      <button id="action" type="button">START</button>
      <p class="hint">SPACE / CLICK / TAP · AGAIN IN THE AIR = DOUBLE JUMP</p>
      <label class="sound-setting"><input id="sound" type="checkbox" checked> <span id="sound-label">Sound on</span></label>
    </footer>
  </main>
</body>
</html>
